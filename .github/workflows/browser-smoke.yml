name: Browser Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Playwright browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Configure local-only test secrets
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          ACCOUNT_AUTH_SECRET=local-browser-test-session-secret
          SCANNER_BOOTSTRAP_TOKEN=local-browser-test-bootstrap
          PRODUCTION_SMOKE_TOKEN=local-browser-test-smoke
          QVAPAY_APP_ID=local-test-app
          QVAPAY_APP_SECRET=local-test-secret
          QVAPAY_USER_API_TOKEN=local-test-user-token
          EOF

      - name: Run browser smoke tests
        run: npm run test:browser
        env:
          CI: "true"

      - name: Remove local test secrets
        if: always()
        run: rm -f .dev.vars
