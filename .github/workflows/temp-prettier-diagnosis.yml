name: Temporary Prettier diagnosis
on:
  pull_request:
permissions:
  contents: write
jobs:
  format-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Apply canonical Prettier formatting
        run: |
          npx prettier@3.9.0 tests/infrastructure/cloudflare-public-app.test.ts --write
          git diff --check
          if ! git diff --quiet -- tests/infrastructure/cloudflare-public-app.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/infrastructure/cloudflare-public-app.test.ts
            git commit -m "fix(test): apply canonical Prettier formatting"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
