name: Cloudflare Deploy

on:
  workflow_run:
    workflows:
      - Repository Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy qvapay-ai-runtime
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout verified commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Generate bootstrap token
        id: bootstrap-token
        shell: bash
        run: |
          set -euo pipefail
          SCANNER_BOOTSTRAP_TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          printf 'token=%s\n' "$SCANNER_BOOTSTRAP_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy Worker with bootstrap secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SCANNER_BOOTSTRAP_TOKEN: ${{ steps.bootstrap-token.outputs.token }}
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({SCANNER_BOOTSTRAP_TOKEN: process.env.SCANNER_BOOTSTRAP_TOKEN}))" "$SECRETS_FILE"
          npx wrangler deploy --secrets-file "$SECRETS_FILE"

      - name: Start scanner
        env:
          WORKER_URL: https://qvapay-ai-runtime.osleyder-gonzalez1985.workers.dev
          SCANNER_BOOTSTRAP_TOKEN: ${{ steps.bootstrap-token.outputs.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
            --header "Accept: application/json" \
            "$WORKER_URL/internal/scanner/start"
