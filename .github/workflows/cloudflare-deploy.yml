name: Cloudflare Deploy

on:
  workflow_run:
    workflows:
      - Repository Quality Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy qvapay-ai-runtime
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout verified commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker and verify scanner runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: https://qvapay-ai-runtime.osleyder-gonzalez1985.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          SCANNER_BOOTSTRAP_TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$SCANNER_BOOTSTRAP_TOKEN"

          printf '%s' "$SCANNER_BOOTSTRAP_TOKEN" | npx wrangler secret put SCANNER_BOOTSTRAP_TOKEN
          npx wrangler deploy

          START_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
            --header "Accept: application/json" \
            "$WORKER_URL/internal/scanner/start")"
          printf '%s\n' "$START_RESPONSE"

          printf 'Waiting for Durable Object Alarm...\n'
          sleep 20

          STATE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
            --header "Accept: application/json" \
            "$WORKER_URL/internal/scanner/state")"
          printf '%s\n' "$STATE_RESPONSE"

          node -e '
            const state = JSON.parse(process.argv[1]);
            const execution = state.execution;
            if (
              state.configured !== true ||
              state.coin !== "QUSD" ||
              state.intervalSeconds !== 10 ||
              execution?.lastStartedAt == null ||
              execution?.lastCompletedAt == null ||
              execution.lastCompletedAt < execution.lastStartedAt ||
              state.nextAlarmAt == null
            ) {
              console.error("Production scanner runtime verification failed");
              process.exit(1);
            }
          ' "$STATE_RESPONSE"
