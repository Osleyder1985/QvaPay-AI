name: Cloudflare Deploy

on:
  workflow_run:
    workflows:
      - Security Gate
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  deploy:
    name: Deploy qvapay-ai-runtime
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main') }}
    runs-on: macos-latest
    environment: production
    steps:
      - name: Checkout verified commit
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout manual ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Verify required quality and security gates
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            RUNS="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$VERIFIED_SHA&per_page=50")"

            if printf '%s' "$RUNS" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const successful = new Set(
                  (data.workflow_runs ?? [])
                    .filter((run) => run.conclusion === "success")
                    .map((run) => run.name),
                );
                const required = ["Repository Quality Gate", "Security Gate"];
                const missing = required.filter((name) => !successful.has(name));
                if (missing.length === 0) {
                  console.log(`Required gates passed for ${process.env.VERIFIED_SHA}.`);
                  process.exit(0);
                }
                console.log(`Waiting for required gates on ${process.env.VERIFIED_SHA}: ${missing.join(", ")}`);
                process.exit(1);
              });
            '; then
              break
            fi

            if [ "$attempt" -eq 24 ]; then
              echo "Required quality/security gates did not both succeed within 120 seconds."
              exit 1
            fi
            sleep 5
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Deploy Worker and verify production application
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_AUTH_SECRET: ${{ secrets.ACCOUNT_AUTH_SECRET }}
          WORKER_URL: https://qvapay-ai-runtime.osleyder-gonzalez1985.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$ACCOUNT_AUTH_SECRET" ]; then
            echo "Missing required GitHub Actions secret: ACCOUNT_AUTH_SECRET. Configure it before production authentication smoke can run."
            exit 1
          fi

          SCANNER_BOOTSTRAP_TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$SCANNER_BOOTSTRAP_TOKEN"

          printf '%s' "$SCANNER_BOOTSTRAP_TOKEN" | npx wrangler secret put SCANNER_BOOTSTRAP_TOKEN
          npx wrangler deploy

          echo "Verifying public application root..."
          ROOT_STATUS="000"
          for attempt in $(seq 1 24); do
            ROOT_STATUS="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 10 "$WORKER_URL/" || true)"
            printf 'Public root attempt %s/24: HTTP %s\n' "$attempt" "$ROOT_STATUS"

            if [ "$ROOT_STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done

          if [ "$ROOT_STATUS" != "200" ]; then
            echo "Production application root did not return HTTP 200 after 120 seconds"
            exit 1
          fi

          echo "Verifying authentication boundary and authenticated identity provenance..."
          ACCOUNT_STATUS="$(curl --silent --show-error --output /tmp/qvapay-account-response.json --write-out '%{http_code}' --max-time 15 \
            --request GET \
            --header "Accept: application/json" \
            "$WORKER_URL/api/account" || true)"
          printf 'Production /api/account status: HTTP %s\n' "$ACCOUNT_STATUS"

          if [ "$ACCOUNT_STATUS" != "401" ]; then
            echo "Account API security-boundary assertion failed: unauthenticated production access must remain HTTP 401."
            cat /tmp/qvapay-account-response.json || true
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const body = fs.readFileSync("/tmp/qvapay-account-response.json", "utf8");
          if (body.includes("QVAPAY_APP_SECRET") || body.includes("QVAPAY_USER_API_TOKEN") || body.includes("app-secret")) {
            console.error("Production /api/account response contains an operational secret marker.");
            process.exit(1);
          }
          console.log("Production account security boundary passed: unauthenticated access is blocked and no operational secret marker was exposed.");
          console.log("Account identity provenance remains BLOCKED until an authenticated production session can be exercised; this gate intentionally prevents false certification of Issue #97.");
          NODE

          echo "Verifying unauthenticated scanner boundary..."
          STATUS_RESPONSE="$(curl --silent --show-error --output /tmp/qvapay-scanner-unauth-response.json --write-out '%{http_code}' --max-time 15 \
            --request GET \
            --header "Accept: application/json" \
            "$WORKER_URL/api/scanner/status" || true)"
          printf 'Production /api/scanner/status unauthenticated status: HTTP %s\n' "$STATUS_RESPONSE"
          if [ "$STATUS_RESPONSE" != "401" ]; then
            echo "Scanner API security-boundary assertion failed: unauthenticated access must remain HTTP 401."
            cat /tmp/qvapay-scanner-unauth-response.json || true
            exit 1
          fi

          echo "Verifying unauthenticated root is the protected login surface..."
          DASHBOARD_HTML="$(curl --fail-with-body --silent --show-error "$WORKER_URL/")"
          printf '%s' "$DASHBOARD_HTML" > /tmp/qvapay-login.html
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("/tmp/qvapay-login.html", "utf8");
          const required = [
            ["Control de acceso · ISO/IEC 27001", "login security marker"],
            ["QvaPay-AI · Acceso seguro", "login page title"],
            ["Autentíquese para acceder a sus módulos y datos.", "protected application message"],
            ['id="login"', "login form"],
          ];
          const missing = required.filter(([needle]) => !input.includes(needle)).map(([, label]) => label);
          if (missing.length > 0) {
            console.error("Login HTML assertions failed:", missing.join(", "));
            process.exit(1);
          }
          console.log(`Protected login HTML assertions passed (${required.length}).`);
          NODE

          SMOKE_USERNAME="ci-smoke-${GITHUB_RUN_ID}"
          export SMOKE_USERNAME
          echo "Creating ephemeral production Administration smoke account..."
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.SMOKE_USERNAME,password:process.env.ACCOUNT_AUTH_SECRET}))')" \
            "$WORKER_URL/internal/auth/smoke-user"
          trap 'curl --silent --show-error --request DELETE --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" --header "Content-Type: application/json" --data "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.SMOKE_USERNAME}))')" "$WORKER_URL/internal/auth/smoke-user" >/dev/null 2>&1 || true' EXIT

          echo "Authenticating production smoke session as ephemeral Administration..."
          LOGIN_RESPONSE="$(curl --fail-with-body --silent --show-error --cookie-jar /tmp/qvapay-cookie.txt --request POST --header "Content-Type: application/json" --header "Accept: application/json" --data "$(node -e 'process.stdout.write(JSON.stringify({username:process.env.SMOKE_USERNAME,password:process.env.ACCOUNT_AUTH_SECRET}))')" "$WORKER_URL/api/auth/login")"
          printf '%s\n' "$LOGIN_RESPONSE"
          printf '%s' "$LOGIN_RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              process.exit(data.authenticated === true && data.user?.role === "ADMINISTRATION" ? 0 : 1);
            });
          '

          AUTH_ACCOUNT_RESPONSE="$(curl --fail-with-body --silent --show-error --cookie /tmp/qvapay-cookie.txt --request GET --header "Accept: application/json" "$WORKER_URL/api/account")"
          printf 'Authenticated account:\n%s\n' "$AUTH_ACCOUNT_RESPONSE"
          printf '%s' "$AUTH_ACCOUNT_RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const data = JSON.parse(input);
              const account = data.account;
              const valid = account?.identitySource === "/user" && account?.identity?.username;
              if (!valid) process.exit(1);
              console.log("Authenticated account identity provenance verified from /user.");
            });
          '

          AUTH_SCANNER_STATUS="$(curl --fail-with-body --silent --show-error --cookie /tmp/qvapay-cookie.txt --request GET --header "Accept: application/json" "$WORKER_URL/api/scanner/status")"
          printf 'Authenticated scanner status:\n%s\n' "$AUTH_SCANNER_STATUS"
          printf '%s' "$AUTH_SCANNER_STATUS" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const state = JSON.parse(input);
              const valid = state.snapshotStatus === "AVAILABLE" && Array.isArray(state.buyOffers) && state.buyOffers.length > 0 && Array.isArray(state.sellOffers) && state.sellOffers.length > 0;
              process.exit(valid ? 0 : 1);
            });
          '

          echo "Verifying public dashboard HTML..."
          DASHBOARD_HTML="$(curl --fail-with-body --silent --show-error "$WORKER_URL/")"
          printf '%s' "$DASHBOARD_HTML" > /tmp/qvapay-dashboard.html
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("/tmp/qvapay-dashboard.html", "utf8");
          const required = [
            ["Dashboard operativo", "dashboard title"],
            ["Auditoría y trazabilidad", "audit section"],
            ["ISO/IEC 27001", "ISO security reference"],
            ["MEJOR BUY", "best-buy label"],
            ["MEJOR SELL", "best-sell label"],
            ["Próximo escaneo", "server countdown"],
            ['side==="SELL"?"Comprar":"Vender"', "SELL/BUY action mapping"],
            ['i===0?"best-offer":""', "best-offer row markup"],
            [".action-buy{background:linear-gradient(135deg,#16a765,#42e69a)", "green buy action"],
            [".action-sell{background:linear-gradient(135deg,#d83d59,#ff7188)", "red sell action"],
            ["@keyframes heartbeat", "activity heartbeat animation"],
            ["@keyframes best", "golden best-offer animation"],
            ["ISO 9001 · calidad", "ISO quality footer"],
            ["Server-side 24/7", "server-side footer"],
          ];
          const missing = required
            .filter(([needle]) => !input.includes(needle))
            .map(([, label]) => label);
          if (missing.length > 0) {
            console.error("Dashboard HTML assertions failed:", missing.join(", "));
            process.exit(1);
          }
          console.log(`Dashboard HTML assertions passed (${required.length}).`);
          NODE


          START_RESPONSE=""
          for attempt in $(seq 1 7); do
            if START_RESPONSE="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
              --header "Accept: application/json" \
              "$WORKER_URL/internal/scanner/start")"; then
              break
            fi

            if [ "$attempt" -lt 7 ]; then
              sleep 5
            fi
          done

          if [ -z "$START_RESPONSE" ]; then
            echo "Production scanner bootstrap failed after 30 seconds"
            exit 1
          fi
          printf '%s\n' "$START_RESPONSE"

          FIRST_COMPLETED_AT=""
          for attempt in $(seq 1 80); do
            STATE_RESPONSE=""
            for state_attempt in $(seq 1 3); do
              if STATE_RESPONSE="$(curl --fail-with-body --silent --show-error \
                --request GET \
                --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
                --header "Accept: application/json" \
                "$WORKER_URL/internal/scanner/state")"; then
                break
              fi

              if [ "$state_attempt" -lt 3 ]; then
                sleep 2
              fi
            done

            if [ -z "$STATE_RESPONSE" ]; then
              echo "Scanner state endpoint not ready on verification attempt $attempt/80"
              if [ "$attempt" -lt 80 ]; then
                sleep 3
                continue
              fi
              exit 1
            fi

            printf 'Runtime state attempt %s/80:\n%s\n' "$attempt" "$STATE_RESPONSE"

            if printf '%s' "$STATE_RESPONSE" | FIRST_COMPLETED_AT="$FIRST_COMPLETED_AT" node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const state = JSON.parse(input);
                const execution = state.execution;
                const completedAt = execution?.lastCompletedAt
                  ? Date.parse(execution.lastCompletedAt)
                  : Number.NaN;
                const startedAt = execution?.lastStartedAt
                  ? Date.parse(execution.lastStartedAt)
                  : Number.NaN;
                const nextAlarmAt = Number.isFinite(Number(state.nextAlarmAt))
                  ? Number(state.nextAlarmAt)
                  : Number.NaN;
                const firstCompletedAt = process.env.FIRST_COMPLETED_AT
                  ? Date.parse(process.env.FIRST_COMPLETED_AT)
                  : Number.NaN;
                const baseValid =
                  state.configured === true &&
                  state.coin === "BANK_CUP" &&
                  Number.isInteger(state.intervalSeconds) &&
                  state.intervalSeconds >= 5 &&
                  state.intervalSeconds <= 300 &&
                  Number.isFinite(startedAt) &&
                  Number.isFinite(completedAt) &&
                  completedAt >= startedAt &&
                  execution.lastError == null &&
                  Number.isFinite(nextAlarmAt) &&
                  nextAlarmAt > completedAt;
                const firstCycleValid =
                  !process.env.FIRST_COMPLETED_AT && baseValid;
                const nextAlarmWithinInterval =
                  Number.isFinite(nextAlarmAt) &&
                  Number.isInteger(state.intervalSeconds) &&
                  nextAlarmAt - completedAt <= state.intervalSeconds * 1000;
                const secondCycleValid =
                  Boolean(process.env.FIRST_COMPLETED_AT) &&
                  baseValid &&
                  nextAlarmWithinInterval &&
                  completedAt > firstCompletedAt;
                if (firstCycleValid || secondCycleValid) {
                  process.stdout.write(execution.lastCompletedAt);
                  process.exit(0);
                }
                process.exit(1);
              });
            ' > /tmp/scanner-completed-at; then
              COMPLETED_AT="$(cat /tmp/scanner-completed-at)"
              if [ -z "$FIRST_COMPLETED_AT" ]; then
                FIRST_COMPLETED_AT="$COMPLETED_AT"
                echo "First successful scanner cycle observed at $FIRST_COMPLETED_AT; waiting for the next scheduled cycle."
              else
                echo "Second successful scanner cycle observed at $COMPLETED_AT; Durable Object Alarm cadence verified."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 80 ]; then
              sleep 5
            fi
          done

          echo "Production scanner runtime verification failed: two consecutive successful cycles were not observed within 400 seconds"
          exit 1
