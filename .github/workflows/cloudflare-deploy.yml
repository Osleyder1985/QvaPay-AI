name: Despliegue de Cloudflare

on:
  workflow_run:
    workflows:
      - Security Gate
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  deploy:
    name: Desplegar qvapay-ai-runtime
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' }}
    runs-on: macos-latest
    environment: production
    steps:
      - name: Obtener el commit verificado
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verificar los controles de calidad y seguridad requeridos
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 24); do
            RUNS="$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$VERIFIED_SHA&per_page=50")"

            if printf '%s' "$RUNS" | node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const data = JSON.parse(input);
                const successful = new Set(
                  (data.workflow_runs ?? [])
                    .filter((run) => run.conclusion === "success")
                    .map((run) => run.name),
                );
                const required = ["Control de Calidad del Repositorio", "Security Gate"];
                const missing = required.filter((name) => !successful.has(name));
                if (missing.length === 0) {
                  console.log(`Required gates passed for ${process.env.VERIFIED_SHA}.`);
                  process.exit(0);
                }
                console.log(`Waiting for required gates on ${process.env.VERIFIED_SHA}: ${missing.join(", ")}`);
                process.exit(1);
              });
            '; then
              break
            fi

            if [ "$attempt" -eq 24 ]; then
              echo "Required quality/security gates did not both succeed within 120 seconds."
              exit 1
            fi
            sleep 5
          done

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Preflight de despliegue de Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run

      - name: Desplegar Worker y verificar la aplicación de producción
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_AUTH_SECRET: ${{ secrets.ACCOUNT_AUTH_SECRET }}
          QVAPAY_USER_API_TOKEN: ${{ secrets.QVAPAY_USER_API_TOKEN }}
          WORKER_URL: https://qvapay-ai-runtime.osleyder-gonzalez1985.workers.dev
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$ACCOUNT_AUTH_SECRET" ]; then
            echo "Missing required GitHub Actions secret: ACCOUNT_AUTH_SECRET. Configure it before production authentication smoke can run."
            exit 1
          fi
          if [ -z "$QVAPAY_USER_API_TOKEN" ]; then
            echo "Missing required GitHub Actions secret: QVAPAY_USER_API_TOKEN. Configure the QvaPay user API token before production identity smoke can run."
            exit 1
          fi
          SCANNER_BOOTSTRAP_TOKEN="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$SCANNER_BOOTSTRAP_TOKEN"

          npx wrangler deploy

          echo "Uploading required Worker secrets..."
          printf '%s' "$ACCOUNT_AUTH_SECRET" | npx wrangler secret put ACCOUNT_AUTH_SECRET
          printf '%s' "$QVAPAY_USER_API_TOKEN" | npx wrangler secret put QVAPAY_USER_API_TOKEN
          printf '%s' "$SCANNER_BOOTSTRAP_TOKEN" | npx wrangler secret put SCANNER_BOOTSTRAP_TOKEN

          echo "Waiting for Cloudflare secret propagation before authenticated smoke..." 
          sleep 10

          echo "Verifying public application root..."
          ROOT_STATUS="000"
          for attempt in $(seq 1 24); do
            ROOT_STATUS="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --max-time 10 "$WORKER_URL/" || true)"
            printf 'Public root attempt %s/24: HTTP %s\n' "$attempt" "$ROOT_STATUS"

            if [ "$ROOT_STATUS" = "200" ]; then
              break
            fi

            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done

          if [ "$ROOT_STATUS" != "200" ]; then
            echo "Production application root did not return HTTP 200 after 120 seconds"
            exit 1
          fi

          echo "Verifying authentication boundary and authenticated identity provenance..."
          ACCOUNT_STATUS="$(curl --silent --show-error --output /tmp/qvapay-account-response.json --write-out '%{http_code}' --max-time 15 \
            --request GET \
            --header "Accept: application/json" \
            "$WORKER_URL/api/account" || true)"
          printf 'Production /api/account status: HTTP %s\n' "$ACCOUNT_STATUS"

          if [ "$ACCOUNT_STATUS" != "401" ]; then
            echo "Account API security-boundary assertion failed: unauthenticated production access must remain HTTP 401."
            cat /tmp/qvapay-account-response.json || true
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const body = fs.readFileSync("/tmp/qvapay-account-response.json", "utf8");
          if (body.includes("QVAPAY_APP_SECRET") || body.includes("QVAPAY_USER_API_TOKEN") || body.includes("app-secret")) {
            console.error("Production /api/account response contains an operational secret marker.");
            process.exit(1);
          }
          console.log("Production account security boundary passed: unauthenticated access is blocked and no operational secret marker was exposed.");
          console.log("Account identity provenance remains BLOCKED until an authenticated production session can be exercised; this gate intentionally prevents false certification of Issue #97.");
          NODE

          echo "Verifying unauthenticated scanner boundary..."
          STATUS_RESPONSE="$(curl --silent --show-error --output /tmp/qvapay-scanner-unauth-response.json --write-out '%{http_code}' --max-time 15 \
            --request GET \
            --header "Accept: application/json" \
            "$WORKER_URL/api/scanner/status" || true)"
          printf 'Production /api/scanner/status unauthenticated status: HTTP %s\n' "$STATUS_RESPONSE"
          if [ "$STATUS_RESPONSE" != "401" ]; then
            echo "Scanner API security-boundary assertion failed: unauthenticated access must remain HTTP 401."
            cat /tmp/qvapay-scanner-unauth-response.json || true
            exit 1
          fi

          echo "Verifying unauthenticated root is the protected login surface..."
          DASHBOARD_HTML="$(curl --fail-with-body --silent --show-error "$WORKER_URL/")"
          printf '%s' "$DASHBOARD_HTML" > /tmp/qvapay-login.html
          node <<'NODE'
          const fs = require("node:fs");
          const input = fs.readFileSync("/tmp/qvapay-login.html", "utf8");
          const required = [
            ["Control de acceso · ISO/IEC 27001", "login security marker"],
            ["QvaPay-AI · Acceso seguro", "login page title"],
            ["Autentíquese para acceder a sus módulos y datos.", "protected application message"],
            ['id="login"', "login form"],
          ];
          const missing = required.filter(([needle]) => !input.includes(needle)).map(([, label]) => label);
          if (missing.length > 0) {
            console.error("Login HTML assertions failed:", missing.join(", "));
            process.exit(1);
          }
          console.log(`Protected login HTML assertions passed (${required.length}).`);
          NODE

          echo "Creating ephemeral production authentication smoke account..."
          SMOKE_USERNAME="ci-smoke-account-$(date +%s)-$RANDOM"
          SMOKE_PASSWORD="$(node -e "console.log(require('crypto').randomBytes(24).toString('base64url'))")"
          echo "::add-mask::$SMOKE_USERNAME"
          echo "::add-mask::$SMOKE_PASSWORD"

          cleanup_smoke_user() {
            curl --silent --show-error --output /dev/null --max-time 15 \
              --request DELETE \
              --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "{\"username\":\"$SMOKE_USERNAME\"}" \
              "$WORKER_URL/internal/auth/smoke-user" || true
          }
          trap cleanup_smoke_user EXIT

          CREATE_SMOKE_RESPONSE=""
          for attempt in $(seq 1 7); do
            if CREATE_SMOKE_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 15 \
              --request POST \
              --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "{\"username\":\"$SMOKE_USERNAME\",\"password\":\"$SMOKE_PASSWORD\"}" \
              "$WORKER_URL/internal/auth/smoke-user")"; then
              break
            fi
            echo "Production smoke-user creation not ready on attempt $attempt/7."
            if [ "$attempt" -lt 7 ]; then
              sleep 5
            fi
          done
          if [ -z "$CREATE_SMOKE_RESPONSE" ]; then
            echo "Production smoke-user creation failed after 40 seconds."
            exit 1
          fi
          printf '%s\n' "$CREATE_SMOKE_RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const body = JSON.parse(input);
              if (!body.user || body.user.role !== "ADMINISTRATION") process.exit(1);
              console.log("Ephemeral production smoke account created with ADMINISTRATION role.");
            });
          '

          echo "Authenticating smoke account against production..."
          LOGIN_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 15 \
            --request POST \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --cookie-jar /tmp/qvapay-account-smoke.cookies \
            --data "{\"username\":\"$SMOKE_USERNAME\",\"password\":\"$SMOKE_PASSWORD\"}" \
            "$WORKER_URL/api/auth/login")"
          printf '%s\n' "$LOGIN_RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const body = JSON.parse(input);
              if (body.authenticated !== true || body.user?.role !== "ADMINISTRATION") process.exit(1);
              console.log("Authenticated production session established for smoke account.");
            });
          '

          echo "Synchronizing QvaPay Account through the authenticated production boundary..."
          SYNC_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 90 \
            --request POST \
            --header "Accept: application/json" \
            --cookie /tmp/qvapay-account-smoke.cookies \
            "$WORKER_URL/api/account/sync")"
          printf '%s\n' "$SYNC_RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const body = JSON.parse(input);
              const account = body.account;
              if (!account || !account.identity || !account.application) {
                console.error("Authenticated Account sync did not return both identity and application data.");
                process.exit(1);
              }
              const username = account.identity.username;
              const applicationUuid = account.application.uuid;
              const configuredApplicationUuid = account.application.uuid;
              const ownerCorrelationOk = account.ownerCorrelationOk;
              const ownerCorrelationProvenance = account.ownerCorrelationProvenance;
              const ownerEndpoint = ownerCorrelationProvenance?.endpoint;
              const ownerStatus = ownerCorrelationProvenance?.status;
              const ownerError = ownerCorrelationProvenance?.error ?? null;
              if (typeof username !== "string" || !username || typeof applicationUuid !== "string" || !applicationUuid) {
                console.error("Authenticated Account sync returned incomplete identity/application provenance.");
                process.exit(1);
              }
              if (ownerCorrelationOk !== true) {
                console.error("Production owner/application correlation assertion failed: ownerCorrelationOk must be true.");
                console.error(JSON.stringify({ ownerCorrelationOk, ownerCorrelationProvenance }));
                process.exit(1);
              }
              if (applicationUuid !== configuredApplicationUuid) {
                console.error("Production owner/application correlation assertion failed: application UUID mismatch.");
                process.exit(1);
              }
              if (ownerEndpoint !== "/app/" + applicationUuid || ownerStatus !== "verified" || ownerError !== null) {
                console.error("Production owner/application provenance assertion failed.");
                console.error(JSON.stringify({ ownerCorrelationProvenance }));
                process.exit(1);
              }
              if (account.integrationStatus === "verified" && ownerCorrelationOk !== true) {
                console.error("Fail-closed assertion failed: verified integration without owner correlation.");
                process.exit(1);
              }
              const serialized = JSON.stringify(account);
              if (serialized.includes("QVAPAY_APP_SECRET") || serialized.includes("QVAPAY_USER_API_TOKEN") || serialized.includes("app-secret")) {
                console.error("Authenticated Account response contains an operational secret marker.");
                process.exit(1);
              }
              console.log("Authenticated Account sync passed.");
              console.log(`Observed QvaPay identity username: ${username}`);
              console.log(`Observed QvaPay application UUID: ${applicationUuid}`);
              console.log(`Owner correlation: ${ownerCorrelationOk}`);
              console.log(`Owner correlation endpoint: ${ownerEndpoint}`);
              console.log(`Owner correlation status: ${ownerStatus}`);
              console.log(`Balance source status: ${account.balanceSource?.status ?? "unknown"}`);
              console.log(`P2P source status: ${account.ownOffersProvenance?.status ?? "unknown"}`);
              console.log(`Integration status reported by current contract: ${account.integrationStatus ?? "unknown"}`);
            });
          '

          echo "Reading Account through the authenticated production GET boundary..."
          AUTH_ACCOUNT_RESPONSE="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --request GET \
            --header "Accept: application/json" \
            --cookie /tmp/qvapay-account-smoke.cookies \
            "$WORKER_URL/api/account")"
          printf '%s\n' "$AUTH_ACCOUNT_RESPONSE" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const body = JSON.parse(input);
              if (!body.account || !body.account.identity || !body.account.application) {
                console.error("Authenticated /api/account did not return the persisted connected-account identity and application.");
                process.exit(1);
              }
              console.log("Authenticated production /api/account evidence passed.");
              console.log(`Authenticated identity: ${body.account.identity.username}`);
              console.log(`Application UUID: ${body.account.application.uuid}`);
              console.log(`Snapshot captured at: ${body.snapshot?.capturedAt ?? "unknown"}`);
            });
          '

          echo "Authenticated production Account evidence established, including owner/application correlation for #196."

          START_RESPONSE=""
          for attempt in $(seq 1 7); do
            if START_RESPONSE="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
              --header "Accept: application/json" \
              "$WORKER_URL/internal/scanner/start")"; then
              break
            fi

            if [ "$attempt" -lt 7 ]; then
              sleep 5
            fi
          done

          if [ -z "$START_RESPONSE" ]; then
            echo "Production scanner bootstrap failed after 30 seconds"
            exit 1
          fi
          printf '%s\n' "$START_RESPONSE"

          FIRST_COMPLETED_AT=""
          for attempt in $(seq 1 80); do
            STATE_RESPONSE=""
            for state_attempt in $(seq 1 3); do
              if STATE_RESPONSE="$(curl --fail-with-body --silent --show-error \
                --request GET \
                --header "Authorization: Bearer $SCANNER_BOOTSTRAP_TOKEN" \
                --header "Accept: application/json" \
                "$WORKER_URL/internal/scanner/state")"; then
                break
              fi

              if [ "$state_attempt" -lt 3 ]; then
                sleep 2
              fi
            done

            if [ -z "$STATE_RESPONSE" ]; then
              echo "Scanner state endpoint not ready on verification attempt $attempt/80"
              if [ "$attempt" -lt 80 ]; then
                sleep 3
                continue
              fi
              exit 1
            fi

            printf 'Runtime state attempt %s/80:\n%s\n' "$attempt" "$STATE_RESPONSE"

            if printf '%s' "$STATE_RESPONSE" | FIRST_COMPLETED_AT="$FIRST_COMPLETED_AT" node -e '
              let input = "";
              process.stdin.on("data", (chunk) => { input += chunk; });
              process.stdin.on("end", () => {
                const state = JSON.parse(input);
                const execution = state.execution;
                const completedAt = execution?.lastCompletedAt
                  ? Date.parse(execution.lastCompletedAt)
                  : Number.NaN;
                const startedAt = execution?.lastStartedAt
                  ? Date.parse(execution.lastStartedAt)
                  : Number.NaN;
                const nextAlarmAt = Number.isFinite(Number(state.nextAlarmAt))
                  ? Number(state.nextAlarmAt)
                  : Number.NaN;
                const firstCompletedAt = process.env.FIRST_COMPLETED_AT
                  ? Date.parse(process.env.FIRST_COMPLETED_AT)
                  : Number.NaN;
                const baseValid =
                  state.configured === true &&
                  state.coin === "BANK_CUP" &&
                  Number.isInteger(state.intervalSeconds) &&
                  state.intervalSeconds >= 5 &&
                  state.intervalSeconds <= 300 &&
                  Number.isFinite(startedAt) &&
                  Number.isFinite(completedAt) &&
                  completedAt >= startedAt &&
                  execution.lastError == null &&
                  Number.isFinite(nextAlarmAt) &&
                  nextAlarmAt > completedAt;
                const firstCycleValid =
                  !process.env.FIRST_COMPLETED_AT && baseValid;
                const nextAlarmWithinInterval =
                  Number.isFinite(nextAlarmAt) &&
                  Number.isInteger(state.intervalSeconds) &&
                  nextAlarmAt - completedAt <= state.intervalSeconds * 1000;
                const secondCycleValid =
                  Boolean(process.env.FIRST_COMPLETED_AT) &&
                  baseValid &&
                  nextAlarmWithinInterval &&
                  completedAt > firstCompletedAt;
                if (firstCycleValid || secondCycleValid) {
                  process.stdout.write(execution.lastCompletedAt);
                  process.exit(0);
                }
                process.exit(1);
              });
            ' > /tmp/scanner-completed-at; then
              COMPLETED_AT="$(cat /tmp/scanner-completed-at)"
              if [ -z "$FIRST_COMPLETED_AT" ]; then
                FIRST_COMPLETED_AT="$COMPLETED_AT"
                echo "First successful scanner cycle observed at $FIRST_COMPLETED_AT; waiting for the next scheduled cycle."
              else
                echo "Second successful scanner cycle observed at $COMPLETED_AT; Durable Object Alarm cadence verified."
                exit 0
              fi
            fi

            if [ "$attempt" -lt 80 ]; then
              sleep 5
            fi
          done

          echo "Production scanner runtime verification failed: two consecutive successful cycles were not observed within 400 seconds"
          exit 1
