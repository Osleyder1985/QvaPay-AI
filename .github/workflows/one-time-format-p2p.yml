name: One-time P2P format repair

on:
  push:
    branches:
      - feat/dynamic-p2p-offer-actions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write tests/infrastructure/qvapay-p2p-client.test.ts
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/infrastructure/qvapay-p2p-client.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format P2P client test"
          git push
