name: One-time project formatting

on:
  push:
    branches:
      - feat/premium-modular-ui-foundation

permissions:
  contents: write

jobs:
  format-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        uses: actions/checkout@v4
        with:
          ref: feat/premium-modular-ui-foundation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format project with the pinned Prettier version
        run: npm run format

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style(format): apply project-wide Prettier 3.9.9"
            git push origin HEAD:feat/premium-modular-ui-foundation
          fi

      - name: Verify formatting
        run: npm run format:check

      - name: Verify TypeScript
        run: npm run build

      - name: Verify lint
        run: npm run lint

      - name: Verify tests
        run: npm test

      - name: Verify production dependencies
        run: npm audit --omit=dev --audit-level=high
