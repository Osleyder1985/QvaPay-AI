name: Repository Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-quality:
    name: Documentation quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required documentation
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "docs/requirements/README.md"
            "docs/requirements/system/functional/p2p-market-scanner.md"
            "docs/requirements/system/integration/qvapay-p2p.md"
            "docs/requirements/software/initial-software-requirements.md"
            "docs/requirements/requirements-traceability-matrix.md"
            "docs/architecture/architecture-overview.md"
            "docs/architecture/decisions/ADR-001-modular-monolith.md"
            "docs/architecture/decisions/ADR-002-server-side-scanner.md"
            "docs/architecture/decisions/ADR-003-qvapay-adapter.md"
            "docs/architecture/decisions/ADR-004-event-driven-market-ingestion.md"
            "docs/integration/qvapay-integration-boundary.md"
            "docs/integration/qvapay-p2p-api-contract.md"
            "docs/integration/qvapay-p2p-feed-contract.md"
            "docs/security/security-baseline.md"
            "docs/security/threat-model.md"
            "docs/testing/testing-strategy.md"
            "docs/operations/operations-baseline.md"
            "docs/project/project-structure.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required documentation: $file"
              exit 1
            }
          done

      - name: Validate Markdown structure
        shell: bash
        run: |
          set -euo pipefail

          files="$(find . -type f -name '*.md' -not -path './.git/*' -print)"
          test -n "$files"

          while IFS= read -r file; do
            test -s "$file" || {
              echo "Empty Markdown file: $file"
              exit 1
            }

            first_line="$(head -n 1 "$file")"
            case "$first_line" in
              #*) ;;
              *)
                echo "Markdown document must start with a heading: $file"
                exit 1
                ;;
            esac
          done <<< "$files"

      - name: Validate internal Markdown targets
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          failures = []

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")
              for target in pattern.findall(text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#", 1)[0]
                  if not target:
                      continue
                  candidate = (path.parent / target).resolve()
                  try:
                      candidate.relative_to(root)
                  except ValueError:
                      failures.append(f"{path}: link escapes repository: {target}")
                      continue
                  if not candidate.exists():
                      failures.append(f"{path}: missing target: {target}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Check repository status
        shell: bash
        run: |
          set -euo pipefail
          git status --short
