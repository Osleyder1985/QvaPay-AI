name: Control de Calidad del Repositorio

on:
  pull_request:
  push:
    branches:
      - main
      - governance/spanish-language-control

permissions:
  contents: read

jobs:
  documentation-quality:
    name: Documentation quality
    runs-on: macos-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Verificar la documentación requerida
        shell: bash
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "docs/requirements/README.md"
            "docs/requirements/system/functional/p2p-market-scanner.md"
            "docs/requirements/software/initial-software-requirements.md"
            "docs/requirements/requirements-traceability-matrix.md"
            "docs/architecture/architecture-overview.md"
            "docs/architecture/decisions/ADR-001-modular-monolith.md"
            "docs/architecture/decisions/ADR-002-server-side-scanner.md"
            "docs/architecture/decisions/ADR-003-qvapay-adapter.md"
            "docs/integration/qvapay-integration-boundary.md"
            "docs/security/security-baseline.md"
            "docs/security/threat-model.md"
            "docs/testing/testing-strategy.md"
            "docs/operations/operations-baseline.md"
            "docs/project/project-structure.md"
            "docs/quality/code-documentation-standard.md"
          )

          for file in "${required_files[@]}"; do
            test -f "$file" || {
              echo "Missing required documentation: $file"
              exit 1
            }
          done

      - name: Validar el inventario y la trazabilidad de requisitos normativos
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path("docs/requirements")
          matrix = root / "requirements-traceability-matrix.md"
          if not matrix.is_file():
              print(f"Missing traceability matrix: {matrix}")
              sys.exit(1)

          matrix_text = matrix.read_text(encoding="utf-8")
          normative = sorted(
              p for p in root.rglob("*.md")
              if p.name != "README.md"
          )
          failures = []

          for path in normative:
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  failures.append(f"Empty normative requirements document: {path}")
                  continue
              relative = path.as_posix()
              if relative not in matrix_text and path.name not in matrix_text:
                  failures.append(
                      f"Normative requirements document is not represented in traceability matrix: {relative}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)

          print(f"Normative requirements inventory passed: {len(normative)} documents represented.")
          PY

      - name: Validar consistencia entre estado y evidencia de requisitos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re
          import sys
          matrix = pathlib.Path("docs/requirements/requirements-traceability-matrix.md")
          failures = []
          for line_number, line in enumerate(matrix.read_text(encoding="utf-8").splitlines(), start=1):
              if not line.startswith("|") or line.count("|") < 5:
                  continue
              cells = [cell.strip() for cell in line.strip().strip("|").split("|")]
              if len(cells) < 5 or cells[0] == "ID" or cells[0].startswith("---"):
                  continue
              status, evidence = cells[-1], cells[-2]
              if status in {"Verified", "Certified"} and re.search(r"pendiente|bloquead|sin evidencia|evidencia no disponible|requiere evidencia", evidence, re.IGNORECASE):
                  failures.append(f"Contradicción estado/evidencia en {cells[0]} (línea {line_number}): estado={status!r}, evidencia={evidence!r}")
          if failures:
              print("\n".join(failures)); sys.exit(1)
          print("Consistencia estado/evidencia de requisitos: PASS")
          PY

      - name: Validar la estructura Markdown
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(".")
          files = sorted(root.rglob("*.md"))
          files = [p for p in files if ".git" not in p.parts]

          if not files:
              print("No Markdown files found")
              sys.exit(1)

          failures = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  failures.append(f"Empty Markdown file: {path}")
                  continue

              first_nonempty = next(
                  (line.strip() for line in text.splitlines() if line.strip()),
                  "",
              )
              if not first_nonempty.startswith("#"):
                  failures.append(
                      f"Markdown document must start with a heading: {path}"
                  )

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Validar los destinos Markdown internos
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path(".").resolve()
          pattern = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          failures = []

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue

              text = path.read_text(encoding="utf-8")
              for target in pattern.findall(text):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = target.split("#", 1)[0]
                  if not target:
                      continue
                  candidate = (path.parent / target).resolve()
                  try:
                      candidate.relative_to(root)
                  except ValueError:
                      failures.append(f"{path}: link escapes repository: {target}")
                      continue
                  if not candidate.exists():
                      failures.append(f"{path}: missing target: {target}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Comprobar la convención lingüística de la documentación
        run: node scripts/check-documentation-language.mjs

      - name: Comprobar la documentación del código fuente
        run: npm run check:code-docs

      - name: Comprobar el estado del repositorio
        shell: bash
        run: |
          set -euo pipefail
          git status --short

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: |
          npm install -g npm@11.19.0
          npm install --no-audit --no-fund

      - name: Comprobar tipos
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Validar el paquete de despliegue de Cloudflare
        run: npx wrangler deploy --dry-run

      - name: Impedir exclusiones de Prettier
        run: npm run check:prettier-exclusions

      - name: Verificación de formato con diagnóstico automático
        shell: bash
        run: |
          set -euo pipefail

          if npm run format:check; then
            exit 0
          fi

          echo "::error::Prettier detectó diferencias de formato. Se generará el diff esperado sin ocultar el fallo."
          npm run format:fix

          echo "===== Archivos modificados por Prettier ====="
          git diff --stat

          echo "===== Diff exacto propuesto por Prettier ====="
          git diff -- .

          echo "::error::El formato original no cumplía. Revisa el diff, aplica la reparación en la rama de trabajo y vuelve a ejecutar los controles."
          exit 1

      - name: Pruebas unitarias
        run: npm test

      - name: Pruebas de integración D1 local
        run: npm run test:d1
