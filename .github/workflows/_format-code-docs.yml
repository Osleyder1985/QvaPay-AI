name: Formateo temporal de documentación del código

on:
  push:
    branches:
      - documentation/source-code-standard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Aplicar Prettier
        run: npx prettier --write src/application/scanner-runtime.ts src/domain/market.ts src/domain/offer.ts src/infrastructure/qvapay/p2p-mapper.ts src/infrastructure/qvapay/qvapay-account-client.ts src/infrastructure/qvapay/qvapay-p2p-client.ts scripts/check-code-documentation.mjs

      - name: Publicar formato corregido
        run: |
          if git diff --quiet; then
            echo "No hay cambios de formato."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/scanner-runtime.ts src/domain/market.ts src/domain/offer.ts src/infrastructure/qvapay/p2p-mapper.ts src/infrastructure/qvapay/qvapay-account-client.ts src/infrastructure/qvapay/qvapay-p2p-client.ts scripts/check-code-documentation.mjs
          git commit -m "style(code): aplicar formato Prettier"
          git push
