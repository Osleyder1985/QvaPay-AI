name: Temporary Prettier Diagnostic

on:
  push:
    branches:
      - fix/accurate-p2p-offer-dashboard

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/infrastructure/qvapay/p2p-contract.ts
      - run: git diff -- src/infrastructure/qvapay/p2p-contract.ts
