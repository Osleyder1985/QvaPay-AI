name: Temporary Prettier Diagnostic

on:
  push:
    branches:
      - fix/reconcile-qvapay-integration-contract

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write "src/infrastructure/qvapay/qvapay-p2p-client.ts" "tests/infrastructure/qvapay-p2p-client.test.ts"
      - run: git diff -- src/infrastructure/qvapay/qvapay-p2p-client.ts tests/infrastructure/qvapay-p2p-client.test.ts
