name: Formatear rama de gobernanza

on:
  push:
    branches:
      - governance/spanish-language-control

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Aplicar formato
        run: npm run format -- --write
      - name: Confirmar cambios de formato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/market.ts src/infrastructure/qvapay/p2p-mapper.ts src/infrastructure/qvapay/qvapay-account-client.ts src/infrastructure/qvapay/qvapay-p2p-client.ts tests/domain/market.test.ts tests/governance/production-deploy-workflow.test.ts src/infrastructure/cloudflare/public-app.ts tests/application/scanner-runtime.test.ts
          if git diff --cached --quiet; then
            git rm .github/workflows/_format-branch.yml
            git commit -m "chore: retirar automatización temporal de formato"
          else
            git commit -m "style: normalizar formato de archivos modificados"
            git rm .github/workflows/_format-branch.yml
            git commit -m "chore: retirar automatización temporal de formato"
          fi
          git push
