name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main
      - governance/spanish-language-control

permissions:
  contents: write

jobs:
  security:
    name: Security verification
    runs-on: macos-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Verificación de vulnerabilidades de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Comprobación de tipos de TypeScript
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Impedir exclusiones de Prettier
        run: npm run check:prettier-exclusions

      - name: Verificación de formato con diagnóstico automático
        shell: bash
        run: |
          set -euo pipefail

          if npm run format:check; then
            exit 0
          fi

          echo "::error::Prettier detectó diferencias de formato. Se generará el diff esperado sin ocultar el fallo."
          npm run format:fix

          echo "===== Archivos modificados por Prettier ====="
          git diff --stat

          echo "===== Diff exacto propuesto por Prettier ====="
          git diff -- .

          if [[ "${GITHUB_HEAD_REF:-}" == "chore/remove-prettier-ignore-all-files" && "${GITHUB_REPOSITORY}" == "${GITHUB_REPOSITORY_OWNER}/QvaPay-AI" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git add scripts/check-prettier-exclusions.mjs
            if ! git diff --cached --quiet; then
              git commit -m "style: apply canonical Prettier formatting repository-wide"
              git push origin "HEAD:${GITHUB_HEAD_REF}"
              echo "Se registró la reparación canónica en la rama del PR; CI volverá a ejecutarse sobre el nuevo commit."
              exit 0
            fi
          fi

          echo "::error::El formato original no cumplía. Revisa el diff, aplica la reparación en la rama de trabajo y vuelve a ejecutar los controles."
          exit 1

      - name: Verificación lingüística de la documentación
        run: npm run check:docs-language

      - name: Análisis de exposición de secretos
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E '(QVAPAY_APP_SECRET|QVAPAY_USER_API_TOKEN|SCANNER_BOOTSTRAP_TOKEN|P2P_ACTION_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_+/=-]{16,}["'"'"']' -- ':!package-lock.json'; then
            echo "Potential hard-coded credential detected in tracked source."
            exit 1
          fi

          if git grep -n -I -E 'Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{16,}' -- ':!package-lock.json'; then
            echo "Potential hard-coded bearer token detected in tracked source."
            exit 1
          fi

          echo "No hard-coded credential patterns detected."

      - name: Verificación de la frontera de seguridad del navegador
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "src/infrastructure/cloudflare/public-app.ts";
          const source = fs.readFileSync(path, "utf8");

          const forbidden = [
            "x-p2p-action-token",
            "P2P_ACTION_TOKEN",
            "SCANNER_BOOTSTRAP_TOKEN",
            "QVAPAY_APP_SECRET",
            "QVAPAY_USER_API_TOKEN",
            "prompt(",
          ];

          const violations = forbidden.filter((needle) => source.includes(needle));
          if (violations.length > 0) {
            console.error("Browser security boundary violations:", violations.join(", "));
            process.exit(1);
          }

          console.log("Browser security boundary passed.");
          NODE

      - name: Pruebas centradas en seguridad
        run: npm test
