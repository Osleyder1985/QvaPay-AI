name: Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security:
    name: Security verification
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Dependency vulnerability verification
        run: npm audit --audit-level=high

      - name: TypeScript type check
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Format verification
        run: npm run format:check

      - name: Documentation language verification
        run: npm run check:docs-language

      - name: Secret exposure scan
        shell: bash
        run: |
          set -euo pipefail

          if git grep -n -I -E '(QVAPAY_APP_SECRET|QVAPAY_USER_API_TOKEN|SCANNER_BOOTSTRAP_TOKEN|P2P_ACTION_TOKEN)[[:space:]]*[:=][[:space:]]*["'"'"'][A-Za-z0-9_+/=-]{16,}["'"'"']' -- ':!package-lock.json'; then
            echo "Potential hard-coded credential detected in tracked source."
            exit 1
          fi

          if git grep -n -I -E 'Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{16,}' -- ':!package-lock.json'; then
            echo "Potential hard-coded bearer token detected in tracked source."
            exit 1
          fi

          echo "No hard-coded credential patterns detected."

      - name: Browser security boundary verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = "src/infrastructure/cloudflare/public-app.ts";
          const source = fs.readFileSync(path, "utf8");

          const forbidden = [
            "x-p2p-action-token",
            "P2P_ACTION_TOKEN",
            "SCANNER_BOOTSTRAP_TOKEN",
            "QVAPAY_APP_SECRET",
            "QVAPAY_USER_API_TOKEN",
            "prompt(",
          ];

          const violations = forbidden.filter((needle) => source.includes(needle));
          if (violations.length > 0) {
            console.error("Browser security boundary violations:", violations.join(", "));
            process.exit(1);
          }

          console.log("Browser security boundary passed.");
          NODE

      - name: Security-focused tests
        run: npm test -- --runInBand
