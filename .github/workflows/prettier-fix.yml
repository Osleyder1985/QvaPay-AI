name: Temporary Prettier Fix

on:
  push:
    branches:
      - fix/accurate-p2p-offer-dashboard

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx prettier --write src/infrastructure/qvapay/p2p-contract.ts
      - name: Commit formatting
        run: |
          if git diff --quiet -- src/infrastructure/qvapay/p2p-contract.ts; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/qvapay/p2p-contract.ts
          git commit -m "fix: apply Prettier formatting to P2P contract"
          git push
