name = "qvapay-ai-runtime"
main = "src/infrastructure/cloudflare/worker.ts"
compatibility_date = "2026-10-04"
workers_dev = true

[vars]
QVAPAY_API_BASE_URL = "https://api.qvapay.com"
SCANNER_COIN = "BANK_CUP"
SCANNER_INTERVAL_SECONDS = "10"
# ACCOUNT_AUTH_SECRET is configured as a Worker secret; never commit its value.

[durable_objects]
bindings = [
  { name = "SCANNER_SCHEDULER", class_name = "ScannerSchedulerDurableObject" }
]

[exports.ScannerSchedulerDurableObject]
type = "durable-object"
storage = "sqlite"
