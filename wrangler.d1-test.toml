name = "qvapay-ai-runtime"
main = "src/infrastructure/cloudflare/worker.ts"
compatibility_date = "2026-08-27"
workers_dev = true

[vars]
QVAPAY_API_BASE_URL = "https://api.qvapay.com"
SCANNER_COIN = "BANK_CUP"
SCANNER_INTERVAL_SECONDS = "10"
# ACCOUNT_AUTH_SECRET se configura como secreto del Worker; nunca se debe incluir su valor en el repositorio.

[[d1_databases]]
binding = "DB"
database_name = "qvapay-ai-scanner"
database_id = "839d0bc1-6f86-49ff-939a-91dc238783aa"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "SCANNER_SCHEDULER", class_name = "ScannerSchedulerDurableObject" }
]

[exports.ScannerSchedulerDurableObject]
type = "durable-object"
storage = "sqlite"
